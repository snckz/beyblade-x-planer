name: Neuheiten-Radar

on:
  schedule:
    - cron: '17 5 * * *' # täglich ca. 6–7 Uhr österreichischer Zeit
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wiki nach neuen Produkten durchsuchen
        run: node scripts/update-data.mjs
      - name: Daten prüfen
        run: node scripts/validate-data.mjs
      - name: Änderungen committen
        id: commit
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen Produkte."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Neuheiten-Radar: neue Produkte gefunden"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Commits mit GITHUB_TOKEN lösen keinen Push-Workflow aus, deshalb hier direkt neu veröffentlichen.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
