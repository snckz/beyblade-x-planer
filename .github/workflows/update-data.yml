name: Neuheiten-Radar

on:
  schedule:
    - cron: '17 5 * * *' # täglich ca. 6–7 Uhr österreichischer Zeit
  workflow_dispatch:
  # Neue Teile oder geänderte Bild-Logik: Bilder sofort verknüpfen statt bis morgen zu warten.
  push:
    branches: [main]
    paths:
      - 'scripts/update-images.mjs'
      - 'scripts/import-catalog.mjs'
      - 'scripts/seed-db.mjs'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wiki nach neuen Produkten durchsuchen
        run: node scripts/update-data.mjs
      - name: Katalog aus dem Wiki ergänzen (neue Kreisel, ungeprüft)
        run: node scripts/import-catalog.mjs
      - name: Wiki-Bilder verknüpfen (neue Blades; sonntags alle neu prüfen)
        run: |
          if [ "$(date -u +%u)" = "7" ]; then node scripts/update-images.mjs --all; else node scripts/update-images.mjs; fi
      - name: Daten prüfen
        run: node scripts/validate-data.mjs
      - name: Änderungen committen
        id: commit
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine neuen Produkte."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Neuheiten-Radar: Daten aktualisiert"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Commits mit GITHUB_TOKEN lösen keinen Push-Workflow aus, deshalb hier direkt neu veröffentlichen.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
